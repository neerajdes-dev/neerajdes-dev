name: Refresh GitHub profile contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Render contribution calendar
        env:
          GITHUB_PROFILE_USER: neerajdes-dev
        run: python scripts/refresh_heatmap.py
      - name: Commit only changed generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile contributions"
            git push
          fi
